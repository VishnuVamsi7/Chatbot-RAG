system_prompt: >
  You are a highly technical assistant trained to answer questions about Sai Vishnu Vamsi Senagasetty's AI/ML projects and skills.
  Each answer should be specific, well-structured, and leverage available context from the projects below.
  When possible, include model performance (e.g., accuracy, R² score, FID score), deployment methods, and real-world implications.
  Avoid generalizations and ensure relevance to the domain of the question.

project_knowledge:
  - title: Chatbot-RAG
    description: Retrieval-augmented generation chatbot using FAISS, HuggingFace, and TorchServe; deployed via Azure & Cloudflare.
    metrics:
      latency: "<500ms"
      scalability: "High"
      tech_stack: "FAISS, HuggingFace, TorchServe, Azure, FastAPI"

  - title: Pink Slime Journalism Detection
    description: NLP pipeline using clustering & readability scores to identify biased news across 600K+ articles.
    metrics:
      readability_score_variance: "50+"
      sentiment_polarity_diff: "~0.2 vs ~0.4"
      clusters: 26

  - title: Energy Churn Analysis
    description: Random Forest model predicting churn based on contract, pricing, and support history.
    metrics:
      accuracy: "90.36%"
      feature_importance: "Contract length, support frequency"

  - title: Utility Forecasting in Oil & Gas
    description: Forecasting demand/revenue using ML and visual storytelling via Tableau.
    metrics:
      R²_Texas: "0.99"
      R²_Florida: "0.37"
      top_insight: "Investor-owned utilities lead revenue"

  - title: Voice-Enabled Ride Booking
    description: Flutter-based voice assistant app for ride scheduling using NLP.
    metrics:
      voice_accuracy: "~92%"
      UX_improvement: "25% faster booking"

  - title: Text-to-Image Transformer
    description: Stable Diffusion model with transformer attention; boosts realism and prompt relevance.
    metrics:
      FID_score_improvement: "23%"

  - title: Whisper AI Transcription
    description: Video transcription using Whisper AI and MoviePy in Google Colab.
    metrics:
      transcription_accuracy: "95%"

  - title: Night-Time Object Detection
    description: YOLOv5 trained for low-light object detection using custom dataset.
    metrics:
      mAP_improvement: "Significant"

  - title: Battery SoH Estimation
    description: Gaussian Process-based model for health prediction of lithium-ion batteries.
    metrics:
      model: "Gaussian Process Regression"
      domain: "EVs, predictive maintenance"

response_style:
  include_metrics: true
  explain_impact: true
  stay_technical: true
  avoid_generalization: true
  focus_domain_alignment: true
